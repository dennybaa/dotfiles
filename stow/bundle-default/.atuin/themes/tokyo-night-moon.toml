[theme]
name = "tokyo-night-moon"
# parent = "default"

[colors]
# Core text
Base = "#c8d3f5"       # Moon foreground
Muted = "#636da6"      # muted blue-grey
Annotation = "#828bb8" # supporting text

# Alerts
AlertInfo = "#82aaff"  # blue
AlertWarn = "#ffc777"  # yellow/orange
AlertError = "#ff757f" # red

# UI emphasis
Guidance = "#86e1fc"  # cyan
Important = "#ffc777" # yellow
Title = "#82aaff"     # blue

# Shell syntax highlighting
SyntaxCommand = "#82aaff"
SyntaxFlag = "#ffc777"
SyntaxString = "#c3e88d"
SyntaxVariable = "#fca7ea"
SyntaxOperator = "#86e1fc"
SyntaxComment = "#636da6"
