gui:
  showIcons: true
  showFileTree: false
  theme:
    activeBorderColor:
      - '#7aa2f7'
      - bold
    inactiveBorderColor:
      - '#414868'
    searchingActiveBorderColor:
      - '#ff9e64'
      - bold
    optionsTextColor:
      - '#7aa2f7'
    selectedLineBgColor:
      - '#2e3c64'
    selectedRangeBgColor:
      - '#2e3c64'
    cherryPickedCommitBgColor:
      - '#b4f9f8'
    cherryPickedCommitFgColor:
      - '#7aa2f7'
    unstagedChangesColor:
      - '#f7768e'
    defaultFgColor:
      - '#c0caf5'

git:
  commit:
    signOff: true

  diffRenderers:
    - colorarg: always
      command: delta --paging=never

keybinding:
  universal:
    confirmInEditor: [<alt+enter>, <ctrl+s>]

customCommands:
  - key: 'V'
    context: 'global'
    description: 'Toggle Delta side-by-side view'
    command: |
      current=$(git config --global delta.side-by-side)
      if [ "$current" = "true" ]; then
        git config --global delta.side-by-side false
      else
        git config --global delta.side-by-side true
      fi
    loadingText: 'Toggling diff view...'
