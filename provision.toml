# Configuration for the provisioning steps package managers do not cover, such as a
# .deb published only at a URL, default MIME associations or the stow plan (which
# packages a bundle carries).

# Install .deb packages straight from a URL (nothing apt knows about).
# <package> = <url>; <package> is a free-form label, any word.
[deb]
happ = "https://github.com/Happ-proxy/happ-desktop/releases/download/4.5.4/Happ.linux.x64.deb"
mailspring = "https://github.com/Foundry376/Mailspring/releases/download/1.26.2/mailspring-1.26.2-amd64.deb"

# Install single-file .flatpak bundles that are not on Flathub. Not implemented:
# `pkg:deb` ignores this table.
# [flatpak]

# Default MIME associations, applied with `xdg-mime default`.
# Only what the desktop would not pick itself; cosmic-mimeapps.list outranks this.
[mime]
"x-scheme-handler/mailto" = "Mailspring.desktop"
"x-scheme-handler/mailspring" = "Mailspring.desktop"

# Packages this bundle stows. Order = stow order, then hook order.
# packages = ["pkg", "bundle/pkg"] - bare name = this bundle.
# nushell-scripts first: hooks `use dotlib` from it (NU_LIB_DIRS).
[stow.minimal]
packages = [
  "nushell-scripts",
  "shell",
  "git",
  "tmux",
  "atuin",
  "mise",
  "nvim",
  "pi",
  "agents",
  "gopass",
  "yazi",
  "lazygit",
  "herdr",
  "worktrunk",
  "tuios",
  "podman"
]

# Packages added on top of `minimal`.
# inherits = [{ stow = "<bundle>", exclude_packages = ["pkg"] }] - to replace a
# package, exclude it from the inherited list; stow refuses two owners for one path.
[stow.desktop]
inherits = [{ stow = "minimal" }]
packages = ["mise", "systemd", "autostart", "scripts", "agents", "ghostty", "mdfried", "podman", "pi"]
