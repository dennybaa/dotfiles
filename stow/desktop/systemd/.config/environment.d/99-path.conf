# PATH for units started by the systemd user manager. The user's tool chains are
# prepended to the system PATH instead of replacing it: this file sorts after
# /usr/lib/environment.d/99-environment.conf (a symlink to /etc/environment),
# which is where PATH comes from. ${HOME} expands here, %h does not; the :- form
# keeps a useful PATH if that file ever disappears instead of leaving a trailing
# colon, which would put the cwd on PATH.
PATH=${HOME}/.local/share/mise/shims:${HOME}/.nix-profile/bin:/nix/var/nix/profiles/default/bin:${HOME}/.local/bin:${HOME}/.local/scripts:${PATH:-/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin}
