min_version = "2026.10.4"

[settings]
experimental = true

[env]
# Resolve dotlib from the repo, so hooks don't depend on the
# nushell-scripts package having been stowed first. If dotlib is needed
# run: mise run stow nushell-scripts
NU_LIB_DIRS = "{{ config_root }}/stow/nushell-scripts/.config/nushell/scripts"

[tools]
fnox = "latest"

[secrets.fnox]

[bootstrap.secrets]
github_token = "GITHUB_USER_TOKEN_PUBLIC"

[dotfiles]
"~/.config/mise/github_tokens.toml" = { source = "templates/github_tokens.toml", mode = "template", permissions = "0600" }
"~/.config/nix/nix.conf" = { source = "templates/nix.conf", mode = "template", permissions = "0600" }
"~/.config/systemd/user.conf" = { source = "templates/user.conf", mode = "template" }

[tasks.deploy]
description = "Deploy dotfiles and system config (stow + mise dotfiles)"
depends = [{ task = "stow", args = ["bundle-default"] }]
secrets = ["GITHUB_USER_TOKEN_PUBLIC"]
run = 'mise dot apply --prompt-secrets'

[tasks."nix:rm"]
description = "Remove nix profile"
usage = 'arg "profile"               help="Specifies profile to remove"'
run = 'nix profile remove nix/{{ usage.profile }}'

[tasks."nix:cleanup"]
description = "Run nix-collect-garbage"
run = 'nix-collect-garbage'

[tasks."provision:minimal"]
description = "Provision minimal system"
usage = 'flag "-u --upgrade" help="Upgrade installed packages and flake inputs"'
interactive = true
run = [
  'mise run nix ${usage_upgrade:+--update} minimal',
  'mise run stow podman bundle-default',
  'mise bootstrap packages apply ${usage_upgrade:+--update}',
  '[ -z "$usage_upgrade" ] || mise bootstrap packages upgrade',
  # 'mise run --raw setup:systemd-linger',
]

[tasks."provision:desktop"]
description = "Provision desktop system"
usage = 'flag "-u --upgrade" help="Upgrade installed packages and flake inputs"'
interactive = true
run = [
  'mise run nix ${usage_upgrade:+--update} desktop',
  # needed by desktop nix GUI apps: nix libglvnd resolves mesa from /run/opengl-driver
  'mise run setup:opengl-driver',
  # stow before packages: bundle-desktop brings conf.d/desktop-packages.toml
  'mise run stow podman bundle-default bundle-desktop',
  'mise bootstrap packages apply ${usage_upgrade:+--update}',
  '[ -z "$usage_upgrade" ] || mise bootstrap packages upgrade',
  # 'mise run --raw setup:systemd-linger',
]

[tasks.stow]
description = "Stow dotfiles packages"
usage = '''
arg "<packages>" help="Specify the package(s) to stow (eg: bundle-default, podman etc)" var=#true
'''
# cwd must be the repo root: .stowrc is read from there
# (stow only looks in cwd and $HOME)
dir = '{{ config_root }}'
run = [
  'stow -v ${usage_packages}',
  # Invoke tasks for each package: mise-tasks/<prefix>/<package>
  'mise run glob --prefix stow ${usage_packages}',
]

[tasks."stow:delete"]
description = "Unstow dotfiles packages"
usage = '''
arg  "<packages>" help="Specify the package(s) to stow (eg: bundle-default, podman etc)" var=#true
'''
env = { hookAction = "delete" }
dir = '{{ config_root }}'
run = [
  'mise run glob --prefix stow ${usage_packages}',
  'stow -D -v ${usage_packages}',
]
